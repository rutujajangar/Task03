<!DOCTYPE html>
<html>
<head>
    <title>Quiz Game Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        .quiz-container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #333;
        }

        #question {
            font-size: 22px;
            margin: 20px;
        }

        .option {
            display: block;
            width: 80%;
            margin: 10px auto;
            padding: 12px;
            font-size: 18px;
            cursor: pointer;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: white;
        }

        .option:hover {
            background-color: #ddd;
        }

        #nextBtn {
            background-color: green;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        #nextBtn:hover {
            background-color: darkgreen;
        }

        #result {
            font-size: 22px;
            color: blue;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1>Quiz Game</h1>

    <div id="question"></div>

    <div id="options"></div>

    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div id="result"></div>

</div>


<script>

    // Quiz Questions
    const quiz = [
        {
            question: "1. Who is known as the Father of Computer?",
            options: ["Charles Babbage", "Bill Gates", "Steve Jobs", "Alan Turing"],
            answer: "Charles Babbage"
        },

        {
            question: "2. Which language is used to create web pages?",
            options: ["C", "HTML", "Java", "Python"],
            answer: "HTML"
        },

        {
            question: "3. What does CPU stand for?",
            options: [
                "Central Process Unit",
                "Central Processing Unit",
                "Computer Processing Unit",
                "Control Processing Unit"
            ],
            answer: "Central Processing Unit"
        },

        {
            question: "4. Which data structure follows FIFO?",
            options: ["Stack", "Queue", "Tree", "Array"],
            answer: "Queue"
        },

        {
            question: "5. What does HTTP stand for?",
            options: [
                "Hyper Text Transfer Protocol",
                "High Text Transfer Protocol",
                "Hyper Transfer Text Program",
                "Home Text Transfer Protocol"
            ],
            answer: "Hyper Text Transfer Protocol"
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let selectedAnswer = "";

    function loadQuestion() {

        selectedAnswer = "";

        document.getElementById("question").innerHTML =
            quiz[currentQuestion].question;

        let optionsHTML = "";

        quiz[currentQuestion].options.forEach(function(option) {

            optionsHTML +=
                '<button class="option" onclick="selectAnswer(this)">' +
                option +
                '</button>';

        });

        document.getElementById("options").innerHTML = optionsHTML;
    }


    function selectAnswer(button) {

        let allOptions =
            document.getElementsByClassName("option");

        for (let i = 0; i < allOptions.length; i++) {
            allOptions[i].style.backgroundColor = "white";
        }

        button.style.backgroundColor = "lightblue";

        selectedAnswer = button.innerHTML;
    }


    function nextQuestion() {

        if (selectedAnswer == "") {
            alert("Please select an answer!");
            return;
        }

        if (selectedAnswer ==
            quiz[currentQuestion].answer) {

            score++;
        }

        currentQuestion++;

        if (currentQuestion < quiz.length) {

            loadQuestion();

        } else {

            document.getElementById("question").innerHTML =
                "Quiz Completed!";

            document.getElementById("options").innerHTML = "";

            document.getElementById("nextBtn").style.display =
                "none";

            document.getElementById("result").innerHTML =
                "Your Score is: " + score +
                " out of " + quiz.length;
        }
    }


    // Start Quiz
    loadQuestion();

</script>

</body>
</html>
